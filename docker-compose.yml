version: "3.9"

services:

  # ============================================================
  # 1. DB CONTAINER
  # ============================================================
  db-container:
    build:
      context: .
      dockerfile: Dockerfile.db-container
    container_name: db-container
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./backups:/backups
    ports:
      - "8000:8000"   # expose backup API to discord-bot
    environment:
      - TZ=UTC


  # ============================================================
  # 2. DISCORD BOT CONTAINER
  # ============================================================
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile.discord-bot
    container_name: discord-bot
    restart: unless-stopped
    depends_on:
      - db-container
    env_file:
      - .env
    volumes:
      - ./data:/data       # bot reads/writes sqlite DB here
      - ./backups:/backups # optional: bot can inspect backups if you add features
    environment:
      - TZ=UTC
    command: ["python", "bot.py"]
